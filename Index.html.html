<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Lusaka Markets</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f3f5f0;--card:#fff;--ink:#17231b;--mut:#5d6b61;--line:#d9e0d6;--g:#1d7a3e;--gd:#0f4d27;--cu:#b4561a;--ok:#1d7a3e;--wa:#b4561a;--bad:#b3261e;--vac:#e8ede6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101712;--card:#18221b;--ink:#e8efe9;--mut:#9aab9f;--line:#2b3a2f;--g:#4cbf72;--gd:#2f8a4f;--cu:#e08a4e;--ok:#4cbf72;--wa:#e08a4e;--bad:#ff8a80;--vac:#223027}}
:root[data-theme=dark]{--bg:#101712;--card:#18221b;--ink:#e8efe9;--mut:#9aab9f;--line:#2b3a2f;--g:#4cbf72;--gd:#2f8a4f;--cu:#e08a4e;--ok:#4cbf72;--wa:#e08a4e;--bad:#ff8a80;--vac:#223027}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
header{background:var(--gd);color:#fff;padding:14px 16px 0}
header h1{margin:0;font:700 19px Georgia,serif;letter-spacing:.2px}header p{margin:2px 0 10px;opacity:.8;font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto}nav button{flex:0 0 auto;background:transparent;color:#cfe5d6;border:0;padding:10px 14px;font:600 14px inherit;border-radius:8px 8px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--gd)}@media(prefers-color-scheme:dark){nav button.on{color:var(--g)}}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{font:700 18px Georgia,serif;margin:20px 0 10px}h3{margin:0 0 8px;font-size:15px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.k b{display:block;font:700 24px Georgia,serif}.k span{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mut);font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 14px inherit;cursor:pointer}button.b.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.b.d{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cu);outline-offset:1px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.st{border:2px solid var(--line);background:var(--vac);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.st b{display:block}.st small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.paid{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.st.due{border-color:var(--wa);background:color-mix(in srgb,var(--wa) 16%,var(--card))}.st.sel{outline:3px solid var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.msg{background:color-mix(in srgb,var(--g) 14%,var(--card));border:1px solid var(--g);border-radius:8px;padding:8px 12px;margin:10px 0}.msg.e{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
#qr{display:inline-block;padding:8px;background:#fff;border-radius:8px}.mut{color:var(--mut);font-size:13px}
.pi{width:92px;height:92px;object-fit:cover;border-radius:8px;flex:none}.card a{color:var(--g);font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}#pv,#pvo,#pvw,.ow{width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:6px}.ow{border-radius:50%;margin:0 8px 6px 0;vertical-align:middle}</style></head><body>

const M=()=>msg?`<div class="msg ${msg.e?'e':''}" role="status">${msg.t}</div>`:'';
function go(){nav();$('logo').src=S.logo||LOGO;$('app').innerHTML=M()+(view=='council'?council():view=='manager'?manager():online());save();if(view=='manager'&&sel!=null)drawQR();window.scrollTo({top:0})}

function council(){
 const ms=S.markets,tot=ms.reduce((a,m)=>a+m.stalls.length,0),oc=ms.reduce((a,m)=>a+occN(m),0),al=ms.reduce((a,m)=>a+m.inc.filter(i=>i.t==T).length,0),pd=ms.reduce((a,m,i)=>a+todayPaid(i),0);
 return `<div class="kp"><div class="k"><b>${ms.length}</b><span>Markets registered</span></div><div class="k"><b>${oc}/${tot}</b><span>Stalls allocated</span></div><div class="k"><b>${K(pd)}</b><span>Rent paid to Council today</span></div><div class="k"><b>${al}</b><span>Incident alerts today</span></div><div class="k"><b>${S.wait.length}</b><span>On waiting lists</span></div></div>
 <h2>Markets</h2><label>Search markets, managers or alerts<input type="search" placeholder="e.g. City Market" oninput="const v=this.value.toLowerCase();document.querySelectorAll('#mt tr:not(:first-child)').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(v))"></label><div class="card tw" style="margin-top:8px"><table id="mt"><tr><th>Market</th><th>Manager</th><th>Assistant</th><th>Stalls allocated</th><th>Rent due</th><th>Paid today</th><th>Security</th><th>Alerts</th></tr>
 ${ms.map((m,i)=>`<tr><td><b>${m.name}</b><br><span class="mut">${m.loc}</span></td><td>${m.manager}</td><td>${m.assistant}</td><td>${occN(m)}/${m.stalls.length} (${Math.round(100*occN(m)/m.stalls.length)}%)</td><td>${dueN(m)} stalls</td><td>${K(todayPaid(i))}</td><td><span class="tag ${m.security=='Guards on duty'?'ok':'wa'}">${m.security}</span></td><td>${m.inc.filter(x=>x.t==T).length}</td></tr>`).join('')}</table></div>
 <h2>Latest alerts from all markets</h2><div class="card">${ms.flatMap(m=>m.inc.map(x=>({...x,m:m.name}))).slice(-8).reverse().map(x=>`<div class="row"><span><b>${x.m}</b>: ${x.txt}</span><span class="tag ${x.sev=='High'?'bad':'wa'}">${x.sev}</span></div>`).join('')||'<span class="mut">No alerts yet. Markets are running smoothly.</span>'}</div>
 <h2>Register a new market</h2><div class="card"><div class="f">
 <label>Market name<input id="n_name"></label><label>Location<input id="n_loc"></label><label>Number of stalls / shops<input id="n_st" type="number" min="1" value="20"></label><label>Of these, enclosed shops<input id="n_sp" type="number" min="0" value="0"></label>
 <label>Toilets<input id="n_to" type="number" min="0" value="2"></label><label>Showers<input id="n_sh" type="number" min="0" value="1"></label><label>Market manager<input id="n_mg"></label><label>Assistant manager<input id="n_as"></label>
 <label>Security status<select id="n_se"><option>Guards on duty</option><option>Patrol needed</option><option>No security</option></select></label></div>
 <p><button class="b" onclick="addMarket()">Register market</button></p></div>${logoHTML()}${contactsHTML()}`}
function addMarket(){const v=i=>$(i).value.trim(),n=v('n_name');if(!n||!v('n_loc')||!v('n_mg'))return say('Please enter the market name, location and manager.',1),go();
 if(S.markets.some(m=>m.name.toLowerCase()==n.toLowerCase()))return say('A market with this name is already registered.',1),go();
 let pre=n.replace(/[^a-z]/gi,'').slice(0,3).toUpperCase();while(S.markets.some(m=>m.pre==pre))pre=pre.slice(0,2)+String.fromCharCode(65+Math.random()*26|0);
 S.markets.push({name:n,loc:v('n_loc'),toilets:+v('n_to'),showers:+v('n_sh'),security:v('n_se'),manager:v('n_mg'),assistant:v('n_as')||'Not assigned',pre,inc:[],stalls:Array.from({length:Math.max(1,+v('n_st'))},(_,i)=>({no:i+1,type:i<(+v('n_sp'))?'Shop':'Open stall',occ:null}))});
 say(n+' is registered with '+v('n_st')+' stalls, ready for allocation.');go()}

function manager(){
 const m=S.markets[mk],s=sel!=null?m.stalls[sel]:null;
 return `<div class="sub"><label style="flex:1;min-width:200px">Market<select onchange="mk=+this.value;sel=null;msg=null;go()">${S.markets.map((x,i)=>`<option value="${i}" ${i==mk?'selected':''}>${x.name}</option>`).join('')}</select></label></div>
 <div class="kp"><div class="k"><b>${occN(m)}/${m.stalls.length}</b><span>Stalls allocated</span></div><div class="k"><b>${dueN(m)}</b><span>Rent due this month</span></div><div class="k"><b>${K(todayPaid(mk))}</b><span>Collected today</span></div><div class="k"><b>${m.toilets} / ${m.showers}</b><span>Toilets / showers</span></div></div>
 <div class="card" style="margin-top:12px"><div class="row"><span>Manager: <b>${m.manager}</b> · Assistant: <b>${m.assistant}</b></span><span><select style="width:auto;margin:0" onchange="S.markets[mk].security=this.value;go()">${['Guards on duty','Patrol needed','No security'].map(o=>`<option ${m.security==o?'selected':''}>${o}</option>`).join('')}</select></span></div></div>
 <h2>Stalls</h2><p class="mut">Green: rent paid · Orange: rent due · Grey: vacant. Each stall holds one trader only.</p>
 ${stFilter()}<div class="grid" id="sg">${stallGrid()}</div>
 ${s?stallPanel(m,s):''}
 ${waitHTML()}<div class="two"><div><h2>Report an incident</h2><div class="card"><label>What happened<input id="i_t"></label><label>Type<select id="i_y" onchange="prev()"><option>Fire</option><option>Crime or theft</option><option>Medical emergency</option><option>Other</option></select></label><label>Severity<select id="i_s" onchange="prev()"><option>Low</option><option>Medium</option><option>High</option></select></label><p class="mut" id="rc">Will notify by SMS and email: LCC Control Room</p><p><button class="b" onclick="addInc()">Send alert</button></p>${dispLast()}</div></div>
 <div><h2>Today's incidents</h2><div class="card">${m.inc.filter(x=>x.t==T).map(x=>`<div class="row"><span>${x.txt}</span><span class="tag ${x.sev=='High'?'bad':'wa'}">${x.sev}</span></div>`).join('')||'<span class="mut">No incidents reported today.</span>'}</div></div></div>`}
function stallPanel(m,s){
 if(!s.occ)return `<h2>Allocate stall ${s.no} (${code(m,s.no)})</h2><div class="card"><div class="f">
 <label>Full name<input id="o_n"></label><label>Age<input id="o_a" type="number" min="18" max="99"></label><label>National ID (NRC) number<input id="o_i"></label>
 <label>NRC status<select id="o_s"><option>Verified</option><option>Pending verification</option></select></label><label>Phone number<input id="o_p" type="tel"></label>
 <label>Mobile network<select id="o_net">${NETS.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Mobile money number<input id="o_m" type="tel"></label><label>Items sold<input id="o_it"></label><label>Stall type<select id="o_ty"><option ${s.type=='Open stall'?'selected':''}>Open stall</option><option ${s.type=='Shop'?'selected':''}>Shop</option></select></label><label>Owner photo<input type="file" accept="image/*" onchange="pickImg(event,'o')"><img id="pvo" hidden alt="Owner photo preview"></label></div>
 <p><button class="b" onclick="allocate()">Allocate stall</button></p></div>`;
 const o=s.occ;return `<h2>Stall ${s.no} · ${code(m,s.no)}</h2><div class="card two"><div>
 <img class="ow" alt="${o.name}" src="${o.photo||ph(o.name)}"> <label class="mut" style="display:inline-block">Update photo<input type="file" accept="image/*" onchange="pickImg(event,'u')"></label><div class="row"><span>Trader</span><b>${o.name}, ${o.age}</b></div><div class="row"><span>National ID</span><span>${o.nrc} <span class="tag ${o.nrcOk?'ok':'wa'}">${o.nrcOk?'Verified':'Pending'}</span></span></div>
 <div class="row"><span>Phone</span><span>${o.phone}</span></div><div class="row"><span>Mobile money</span><span>${o.net} · ${o.momo}</span></div><div class="row"><span>Items</span><span>${o.items}</span></div>
 <div class="row"><span>Stall type</span><b>${s.type}</b></div><div class="row"><span>Rates</span><span>Daily ${K(RATE[s.type].daily)} · Monthly ${K(RATE[s.type].monthly)} · Yearly ${K(RATE[s.type].yearly)}</span></div><div class="row"><span>Rent covered until</span><span class="tag ${o.until>=T?'ok':'wa'}">${o.until>=T?o.until:'Due now'}</span></div>
 <p><span style="display:block;margin-bottom:8px"><select id="pp_p" style="width:auto" onchange="payPrev()"><option value="daily">Daily</option><option value="monthly" selected>Monthly</option><option value="yearly">Yearly</option></select> <input id="pp_n" type="number" min="1" value="1" style="width:76px" oninput="payPrev()" aria-label="Number of periods"> <button class="b" onclick="payRent()">Collect via ${o.net}</button><br><span class="mut" id="pp_t"></span></span><button class="b s" onclick="listItem()">List item online</button> <button class="b s" onclick="xfer=!xfer;go()">Change ownership</button> <button class="b d" onclick="vacate()">Vacate</button></p>${s.hist&&s.hist.length?`<p class="mut">Ownership history: ${s.hist.map(h=>h.d+" "+h.from+" → "+h.to+" ("+h.why+")").join("; ")}</p>`:""}</div>
 <div style="text-align:center"><div id="qr"></div><p class="mut">Scan to identify the stall and pay rent</p></div></div>${xfer?xferForm(s):""}`}
function drawQR(){payPrev();const e=$('qr');if(!e)return;e.innerHTML='';const m=S.markets[mk],s=m.stalls[sel];if(!s)return;
 try{new QRCode(e,{text:`LCC|${code(m,s.no)}|${s.occ?s.occ.nrc:'VACANT'}|ZMW200`,width:150,height:150})}catch(x){e.textContent=code(m,s.no)}}
function allocate(){const m=S.markets[mk],s=m.stalls[sel],v=i=>$(i).value.trim(),nrc=v('o_i');
 if(s.occ)return say('This stall already has a trader.',1),go();
 if(!v('o_n')||!nrc||!v('o_p')||!v('o_m')||!(+v('o_a')>=18))return say('Please complete every field. Traders must be 18 or older.',1),go();
 if(m.stalls.some(x=>x.occ&&x.occ.nrc==nrc))return say('This National ID already holds a stall in '+m.name+'. One person, one stall.',1),go();
 s.occ={name:v('o_n'),age:+v('o_a'),nrc,nrcOk:v('o_s')=='Verified',phone:v('o_p'),net:v('o_net'),momo:v('o_m'),items:v('o_it')||'General goods',until:ad(T,-1),photo:oimg};s.type=v('o_ty');oimg='';say('Stall '+s.no+' is allocated to '+s.occ.name+'.');go()}
const MX={daily:365,monthly:12,yearly:3};
function calc(st,p,n){const u=st.occ.until,base=u>=T?ad(u,1):T,end=p=='daily'?ad(base,n-1):ad(am(base,n*(p=='yearly'?12:1)),-1);return{end,amt:RATE[st.type][p]*n}}
function nper(){const p=$('pp_p').value;return Math.max(1,Math.min(MX[p],+$('pp_n').value||1))}
function payPrev(){if(!$('pp_p'))return;const p=$('pp_p').value,n=nper(),c=calc(S.markets[mk].stalls[sel],p,n);$('pp_n').max=MX[p];$('pp_t').textContent='Pay '+K(c.amt)+' for '+n+' '+p.replace('ly','').replace('dai','day')+(n>1?'s':'')+', covered until '+c.end}
function payRent(){const m=S.markets[mk],s=m.stalls[sel],p=$('pp_p').value,n=nper(),c=calc(s,p,n);s.occ.until=c.end;S.pay.push({mi:mk,no:s.no,amt:c.amt,d:T,ch:s.occ.net,plan:p,n});say(K(c.amt)+' received from '+s.occ.name+' via '+s.occ.net+'. Stall '+code(m,s.no)+' is covered until '+c.end+'.');go()}
function vacate(){const m=S.markets[mk],s=m.stalls[sel],old=s.occ.name;(s.hist=s.hist||[]).push({d:T,from:old,to:'Vacant',why:'Vacated'});s.occ=null;S.list=S.list.filter(l=>!(l.mi==mk&&l.no==s.no));const a=autoFill(mk);say('Stall '+s.no+' is now vacant. '+(a.length?a.join(' '):'The next matching applicant will be allocated automatically.'));go()}
function autoFill(mi){const m=S.markets[mi],out=[];m.stalls.forEach(s=>{if(s.occ)return;const i=S.wait.findIndex(w=>w.mi==mi&&w.type==s.type&&(!w.pref||w.pref==s.no));if(i<0)return;const w=S.wait.splice(i,1)[0];
 s.occ={name:w.name,age:w.age,nrc:w.nrc,nrcOk:w.nrcOk,phone:w.phone,net:w.net,momo:w.momo,items:w.items,until:ad(T,-1),photo:w.photo||''};(s.hist=s.hist||[]).push({d:T,from:'Vacant',to:w.name,why:'Waiting list'});out.push(w.name+' from the waiting list is allocated to stall '+s.no+' ('+s.type+').')});return out}
function addApp(){const m=S.markets[mk],v=i=>$(i).value.trim(),nrc=v('w_i');
 if(!v('w_n')||!nrc||!v('w_p')||!v('w_m')||!(+v('w_a')>=18))return say('Please complete every field. Applicants must be 18 or older.',1),go();
 if(m.stalls.some(x=>x.occ&&x.occ.nrc==nrc))return say('This National ID already holds a stall in '+m.name+'. One person, one stall.',1),go();
 if(S.wait.some(w=>w.mi==mk&&w.nrc==nrc))return say('This applicant is already on the waiting list.',1),go();
 const pref=+v('w_s')||0,w={id:Date.now(),mi:mk,type:pref?m.stalls[pref-1].type:v('w_t'),pref,name:v('w_n'),age:+v('w_a'),nrc,nrcOk:v('w_v')=='Verified',phone:v('w_p'),net:v('w_net'),momo:v('w_m'),items:v('w_it')||'General goods',photo:wimg,d:T};wimg='';S.wait.push(w);
 const a=autoFill(mk);if(!S.wait.includes(w))say(a.join(' '));else say(w.name+' is on the waiting list for '+(pref?'stall '+pref:'any available '+w.type)+' (place '+S.wait.filter(x=>x.mi==mk&&x.type==w.type).length+'). Allocation happens automatically when one opens.');go()}
function changeOwner(){const m=S.markets[mk],s=m.stalls[sel],v=i=>$(i).value.trim(),nrc=v('x_i');
 if(!v('x_n')||!nrc||!v('x_p')||!v('x_m')||!(+v('x_a')>=18))return say('Please complete every field. Traders must be 18 or older.',1),go();
 if(m.stalls.some(x=>x.occ&&x.occ.nrc==nrc))return say('This National ID already holds a stall in '+m.name+'. One person, one stall.',1),go();
 const old=s.occ.name;(s.hist=s.hist||[]).push({d:T,from:old,to:v('x_n'),why:v('x_r')});
 s.occ={name:v('x_n'),age:+v('x_a'),nrc,nrcOk:v('x_s')=='Verified',phone:v('x_p'),net:v('x_net'),momo:v('x_m'),items:v('x_it')||s.occ.items,until:ad(T,-1),photo:oimg};oimg='';xfer=false;
 S.wait=S.wait.filter(w=>!(w.mi==mk&&w.nrc==nrc));S.list=S.list.filter(l=>!(l.mi==mk&&l.no==s.no));
 say('Stall '+s.no+' now belongs to '+s.occ.name+' (previously '+old+'). The previous listings are cleared.');go()}
function xferForm(s){return `<div class="card"><h3>Change ownership of stall ${s.no}</h3><div class="f"><label>New owner full name<input id="x_n"></label><label>Age<input id="x_a" type="number" min="18" max="99"></label><label>National ID (NRC) number<input id="x_i"></label>
 <label>NRC status<select id="x_s"><option>Verified</option><option>Pending verification</option></select></label><label>Phone<input id="x_p" type="tel"></label><label>Mobile network<select id="x_net">${NETS.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Mobile money number<input id="x_m" type="tel"></label><label>Items sold<input id="x_it"></label>
 <label>Reason<select id="x_r"><option>Transfer by owner</option><option>Rent default</option><option>Council reassignment</option><option>Family succession</option></select></label><label>New owner photo<input type="file" accept="image/*" onchange="pickImg(event,'o')"><img id="pvo" hidden alt="New owner photo preview"></label></div>
 <p><button class="b" onclick="changeOwner()">Confirm new owner</button> <button class="b s" onclick="xfer=false;go()">Cancel</button></p></div>`}
function waitHTML(){const m=S.markets[mk],W=S.wait.map((w,i)=>({w,i})).filter(x=>x.w.mi==mk),vac=t=>m.stalls.filter(s=>!s.occ&&s.type==t).length;
 return `<h2>Applications and waiting list</h2><div class="card"><p class="mut">Vacant now: ${vac('Open stall')} open stalls, ${vac('Shop')} shops. Applicants are allocated automatically, in order of application, as soon as a matching stall is free.</p><div class="f"><label>Full name<input id="w_n"></label><label>Age<input id="w_a" type="number" min="18" max="99"></label><label>National ID (NRC) number<input id="w_i"></label><label>NRC status<select id="w_v"><option>Verified</option><option>Pending verification</option></select></label><label>Phone<input id="w_p" type="tel"></label><label>Mobile network<select id="w_net">${NETS.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Mobile money number<input id="w_m" type="tel"></label><label>Items to sell<input id="w_it"></label>
 <label>Applying for<select id="w_t"><option>Open stall</option><option>Shop</option></select></label><label>Specific stall (optional)<select id="w_s"><option value="0">Any available</option>${m.stalls.map(s=>`<option value="${s.no}">${s.no} · ${s.type}</option>`).join('')}</select></label><label>Photo<input type="file" accept="image/*" onchange="pickImg(event,'w')"><img id="pvw" hidden alt="Applicant photo preview"></label></div><p><button class="b" onclick="addApp()">Submit application</button></p></div>
 <div class="card tw"><h3>Waiting list (${W.length})</h3>${W.length?`<table><tr><th>Place</th><th>Applicant</th><th>Wants</th><th>Applied</th><th></th></tr>${W.map(({w,i},n)=>`<tr><td>${n+1}</td><td>${w.name}<br><span class="mut">${w.phone}</span></td><td>${w.pref?'Stall '+w.pref:'Any '+w.type}</td><td>${w.d}</td><td><button class="b s" onclick="S.wait.splice(${i},1);go()">Remove</button></td></tr>`).join('')}</table>`:'<span class="mut">The waiting list is clear. New applications will appear here.</span>'}</div>`}
function addInc(){const t=$('i_t').value.trim();if(!t)return say('Describe the incident first.',1),go();S.markets[mk].inc.push({t:T,txt:t,sev:$('i_s').value});say('Alert sent to the Council dashboard.');go()}
function listItem(){view='online';tab='sell';window._pre=[mk,sel];go()}

const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const stars=a=>a&&a.length?`★${avg(a).toFixed(1)} · ${Math.round(100*a.filter(x=>x>=4).length/a.length)}% satisfied (${a.length})`:'No ratings yet';
const ph=t=>{t=t.replace(/[^a-z0-9]/gi,'')||'M';let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="hsl(${h},45%,40%)"/><text x="48" y="64" font-size="44" text-anchor="middle" fill="#fff" font-family="Georgia">${t[0].toUpperCase()}</text></svg>`)};
let flt='all',img='',oimg='',wimg='',xfer=false,q1='',stF='all',tyF='all',q2='',mkF='all',srt='',pmax=0;const fast=l=>l.sold>=5,hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function pickImg(e,k){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,240/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);if(k=='l'){S.logo=c.toDataURL('image/png');go();return}const d=c.toDataURL('image/jpeg',.7);if(k=='u'){S.markets[mk].stalls[sel].occ.photo=d;go()}else if(k=='w'){wimg=d;$('pvw').src=d;$('pvw').hidden=false}else if(k){oimg=d;$('pvo').src=d;$('pvo').hidden=false}else{img=d;$('pv').src=d;$('pv').hidden=false}};im.src=r.result};r.readAsDataURL(f)}
function rec(ty,sev){const by=s=>S.contacts.filter(c=>c.svc==s);let r=by('Council');
 if(sev=='High')r=r.concat(by('Police'),by('Fire'),by('Hospital'),by('Ambulance'),by('Other'));
 else if(sev=='Medium')r=r.concat(ty=='Fire'?by('Fire'):ty=='Medical emergency'?by('Ambulance').concat(by('Hospital')):by('Police'));return r}
function prev(){$('rc').textContent='Will notify by SMS and email: '+rec($('i_y').value,$('i_s').value).map(x=>x.name).join(', ')}
const body=d=>encodeURIComponent(`LCC ALERT (${d.sev}) at ${d.mk}: ${d.txt}`);
const links=d=>d.to.map(c=>`<div class="row"><span>${c.name}<br><span class="mut">${c.phone}</span></span><span><a href="sms:${c.phone}?body=${body(d)}">SMS</a> · <a href="mailto:${c.email}?subject=${encodeURIComponent('LCC alert: '+d.mk)}&body=${body(d)}">Email</a></span></div>`).join('');
function dispLast(){const m=S.markets[mk],d=[...S.disp].reverse().find(x=>x.mk==m.name);return d?`<h3 style="margin-top:12px">Latest alert: tap to send now</h3>${links(d)}`:''}
function addInc(){const t=$('i_t').value.trim();if(!t)return say('Describe the incident first.',1),go();const m=S.markets[mk],ty=$('i_y').value,sev=$('i_s').value,to=rec(ty,sev),txt=`[${ty}] ${t}`;
 m.inc.push({t:T,txt,sev});S.disp.push({when:Date.now(),mk:m.name,txt,sev,to});say('Alert dispatched to '+to.length+' contact(s): '+to.map(x=>x.name).join(', ')+'.');go()}
function addContact(){const v=i=>$(i).value.trim();if(!v('c_n')||!v('c_p'))return say('Add a name and phone number.',1),go();S.contacts.push({svc:v('c_s'),name:v('c_n'),phone:v('c_p'),email:v('c_e')||'none@example.com'});say('Contact added.');go()}
function contactsHTML(){return `<h2>Emergency contacts</h2><div class="card"><p class="mut">Sample contacts. Replace with verified numbers and emails. Low severity alerts go to the Council; Medium adds the matching service; High alerts every listed emergency contact.</p>${S.contacts.map((c,i)=>`<div class="row"><span><b>${c.svc}</b> · ${c.name}<br><span class="mut">${c.phone} · ${c.email}</span></span><button class="b s" onclick="S.contacts.splice(${i},1);go()">Remove</button></div>`).join('')}
<div class="f" style="margin-top:10px"><label>Service<select id="c_s"><option>Police</option><option>Fire</option><option>Hospital</option><option>Ambulance</option><option>Council</option><option>Other</option></select></label><label>Name<input id="c_n"></label><label>Phone<input id="c_p" type="tel"></label><label>Email<input id="c_e" type="email"></label></div><p><button class="b" onclick="addContact()">Add contact</button></p></div>
<h2>Alert dispatch log</h2><div class="card">${S.disp.slice(-5).reverse().map(d=>`<div class="row"><span><b>${d.mk}</b>: ${d.txt}<br><span class="mut">${hm(d.when)} · sent to ${d.to.map(x=>x.name).join(', ')}</span></span><span class="tag ${d.sev=='High'?'bad':'wa'}">${d.sev}</span></div>`).join('')||'<span class="mut">No alerts dispatched yet.</span>'}</div>`}

const STG=['Order confirmed','Collected from stall','On the way','Delivered'];
function prog(o){const e=Date.now()-o.t;return{s:e<20000?0:e<40000?1:e<80000?2:3,p:e<20000?0:e<40000?.1:Math.min(1,.1+.9*(e-40000)/40000)}}
function trk(){return S.orders.slice().reverse().map(o=>{const{s,p}=prog(o),x=20+260*p;return `<div class="card"><div class="row" style="border:0"><b>Order #${o.id}</b><span class="tag ${s==3?'ok':'wa'}">${STG[s]}</span></div>
<div class="mut">${o.items.map(i=>i.q+' × '+i.item).join(', ')} · ${K(o.tot)} · paid by ${o.m}</div>
<svg viewBox="0 0 300 52" width="100%" height="52" role="img" aria-label="Delivery route"><line x1="20" y1="34" x2="280" y2="34" stroke="var(--line)" stroke-width="4"/><line x1="20" y1="34" x2="${x}" y2="34" stroke="var(--g)" stroke-width="4"/><text x="20" y="50" font-size="10" fill="var(--mut)" text-anchor="middle">Stall</text><text x="280" y="50" font-size="10" fill="var(--mut)" text-anchor="middle">You</text><text x="${x}" y="28" font-size="20" text-anchor="middle">${{"Motorbike":"🏍️","3-wheeler":"🛺","Bicycle":"🚲"}[o.vt]||"🚚"}</text></svg>
<div class="mut">${o.vt||'Vehicle'} ${o.veh} · Driver ${o.ag} · ${s==3?'Delivered at '+hm(o.t+80000):'Expected by '+hm(o.t+o.eta*60000)+' (about '+Math.max(1,Math.ceil(o.eta*(1-p)))+' min)'}</div>
${s==3?(o.rated?'<div class="mut">Thank you for rating this order.</div>':`<div class="f" style="margin-top:8px"><label>Rate the seller (5 is best)<select id="rs${o.id}">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></label><label>Rate the transporter<select id="rt${o.id}">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></label></div><p><button class="b" onclick="rate(${o.id})">Submit rating</button></p>`):''}</div>`}).join('')||'<p class="mut">Your orders will appear here with live tracking.</p>'}
setInterval(()=>{const e=$('trk');if(e&&view=='online'&&tab=='track'&&S.orders.some(o=>prog(o).s<3)&&!(document.activeElement&&document.activeElement.tagName=='SELECT'))e.innerHTML=trk()},4000);
function rate(id){const o=S.orders.find(x=>x.id==id),sr=+$('rs'+id).value,tr=+$('rt'+id).value;
 o.items.forEach(x=>{const k=x.mi+'-'+x.no;(S.sr[k]=S.sr[k]||[]).push(sr)});const a=S.agents.find(x=>x.name==o.ag);if(a)a.rt.push(tr);o.rated=1;say('Thank you. Your ratings help other buyers choose with confidence.');go()}

function online(){
 const sub=`<div class="sub">${[['shop','Shop'],['track','Track orders'],['sell','Marketeer listings'],['deliv','Delivery team']].map(([k,l])=>`<button class="b ${tab==k?'':'s'}" onclick="tab='${k}';msg=null;go()">${l}</button>`).join('')}</div>`;
 if(tab=='shop'){const tot=cart.reduce((a,c)=>a+c.price*c.q,0);
 
 return sub+shopFilter()+`<div class="sub">${[['all','All items'],['fast','Fast selling'],['deal','Bargains of the day']].map(([k,t])=>`<button class="b ${flt==k?'':'s'}" onclick="flt='${k}';go()">${t}</button>`).join('')}</div>
 <div class="two" style="grid-template-columns:2fr 1fr"><div id="sl">${shopList()}</div>
 <div><div class="card"><h3>Your basket</h3>${cart.map(c=>`<div class="row"><span>${c.q} × ${c.item}</span><span>${K(c.price*c.q)}</span></div>`).join('')||'<span class="mut">Add items to begin.</span>'}
 ${cart.length?`<p><b>Total ${K(tot)}</b></p><label>Your name<input id="b_n"></label><label>Delivery address<input id="b_a"></label><label>Phone<input id="b_p" type="tel"></label>
 <label>Pay with<select id="b_m"><option>Airtel Money</option><option>MTN MoMo</option><option>Zamtel Kwacha</option><option>Visa debit card</option></select></label>
 <p><button class="b" onclick="checkout(${tot})">Pay ${K(tot)}</button></p>`:''}</div></div></div>`}
 if(tab=='track')return sub+`<p class="mut">Demo tracking advances every few seconds. Live GPS needs a vehicle tracking feed.</p><div id="trk">${trk()}</div>`;
 if(tab=='sell'){const p=window._pre||[0,0];return sub+`<div class="card"><h3>List what you are selling today</h3><div class="f">
 <label>Market<select id="l_m" onchange="window._pre=[+this.value,0];go()">${S.markets.map((x,i)=>`<option value="${i}" ${i==p[0]?'selected':''}>${x.name}</option>`).join('')}</select></label>
 <label>Stall<select id="l_s">${S.markets[p[0]].stalls.filter(s=>s.occ).map(s=>`<option value="${s.no}" ${s.no==(S.markets[p[0]].stalls[p[1]]||{}).no?'selected':''}>${s.no} · ${s.occ.name}</option>`).join('')}</select></label>
 <label>Item<input id="l_i"></label><label>Selling price (K)<input id="l_p" type="number" min="1"></label><label>Normal price (K), for bargains<input id="l_w" type="number" min="0"></label><label>Unit<input id="l_u" value="each"></label><label>Quantity available<input id="l_q" type="number" min="1" value="10"></label>
 <label>Product photo<input type="file" accept="image/*" onchange="pickImg(event)"><img id="pv" hidden alt="Photo preview"></label></div>
 <p><button class="b" onclick="addList()">Publish listing</button></p></div>
 <div class="card"><h3>Today's listings (${S.list.length})</h3>${S.list.map((l,i)=>`<div class="row"><span>${l.item} · ${K(l.price)} · ${l.qty} left · ${l.sold} sold<br><span class="mut">${S.markets[l.mi].name} stall ${l.no}</span></span><span><button class="b s" onclick="S.list[${i}].qty+=10;go()">Restock +10</button> <button class="b s" onclick="S.list.splice(${i},1);go()">Remove</button></span></div>`).join('')}</div>`}
 return sub+`<div class="card"><h3>Register a delivery agent or coordinator</h3><div class="f"><label>Full name<input id="d_n"></label><label>Phone<input id="d_p" type="tel"></label><label>Delivery transport<select id="d_t"><option>Vehicle</option><option>Motorbike</option><option>3-wheeler</option><option>Bicycle</option></select></label><label>Plate or ID (optional for bicycles)<input id="d_v"></label>
 <label>Role<select id="d_r"><option>Delivery agent</option><option>Delivery coordinator</option></select></label><label>Market<select id="d_m"><option>All markets</option>${S.markets.map(x=>`<option>${x.name}</option>`).join('')}</select></label></div>
 <p><button class="b" onclick="addAgent()">Register</button></p></div><div class="card tw"><table><tr><th>Name</th><th>Role</th><th>Transport</th><th>Phone</th><th>Market</th><th>Rating</th></tr>${S.agents.map(a=>`<tr><td>${a.name}</td><td>${a.role}</td><td>${a.vt||'Vehicle'}${a.veh?' · '+a.veh:''}</td><td>${a.phone}</td><td>${a.mk}</td><td>${stars(a.rt)}</td></tr>`).join('')}</table></div>`}
function addCart(i){const l=S.list[i],c=cart.find(x=>x.i==i);if(c&&c.q>=l.qty)return;c?c.q++:cart.push({i,item:l.item,price:l.price,q:1});go()}
function checkout(t){const v=i=>$(i).value.trim();if(!v('b_n')||!v('b_a')||!v('b_p'))return say('Please add your name, address and phone number.',1),go();
 if(cart.some(c=>c.q>S.list[c.i].qty))return say('Stock has changed. Please adjust your basket.',1),go();
 const ag=S.agents.filter(a=>a.role=='Delivery agent'),a=ag[S.orders.length%Math.max(1,ag.length)]||{name:'Awaiting agent',veh:'To be assigned'};
 const items=cart.map(c=>{const l=S.list[c.i];l.qty-=c.q;l.sold+=c.q;return{item:c.item,q:c.q,mi:l.mi,no:l.no}});
 S.orders.push({id:1001+S.orders.length,who:v('b_n'),tot:t,m:v('b_m'),ag:a.name,vt:a.vt||'Vehicle',veh:a.veh||'Pending',t:Date.now(),eta:35,items});cart=[];tab='track';say('Payment of '+K(t)+' confirmed. Track your delivery below.');go()}
function addList(){const v=i=>$(i).value.trim();if(!v('l_i')||!(+v('l_p')>0))return say('Add an item name and a price.',1),go();
 S.list.push({mi:+v('l_m'),no:+v('l_s'),item:v('l_i'),price:+v('l_p'),was:+v('l_w')||0,unit:v('l_u')||'each',qty:+v('l_q')||1,sold:0,img,d:T});img='';say('Listing is live in the online market.');go()}
function addAgent(){const v=i=>$(i).value.trim();if(!v('d_n')||!v('d_p'))return say('Please enter a name and phone number.',1),go();
 if(S.agents.some(a=>a.phone==v('d_p')))return say('This phone number is already registered.',1),go();
 S.agents.push({name:v('d_n'),phone:v('d_p'),vt:v('d_t'),veh:v('d_v'),role:v('d_r'),mk:v('d_m'),rt:[]});say(v('d_n')+' is registered as '+v('d_r')+'.');go()}

const opt=(v,l,c)=>`<option value="${v}" ${String(c)==String(v)?'selected':''}>${l}</option>`;
function stFilter(){return `<div class="f" style="margin:8px 0 12px"><label>Search stalls<input type="search" value="${q1}" placeholder="Stall number, trader, NRC, phone or item" oninput="q1=this.value;$('sg').innerHTML=stallGrid()"></label>
 <label>Rent status<select onchange="stF=this.value;$('sg').innerHTML=stallGrid()">${opt('all','All stalls',stF)}${opt('paid','Rent paid',stF)}${opt('due','Rent due',stF)}${opt('vacant','Vacant',stF)}</select></label>
 <label>Stall type<select onchange="tyF=this.value;$('sg').innerHTML=stallGrid()">${opt('all','All types',tyF)}${opt('Open stall','Open stalls',tyF)}${opt('Shop','Shops',tyF)}</select></label></div>`}
function stallGrid(){const m=S.markets[mk],q=q1.toLowerCase();
 const h=m.stalls.map((x,i)=>({x,i})).filter(({x})=>{const o=x.occ,st=!o?'vacant':o.until>=T?'paid':'due';return(stF=='all'||stF==st)&&(tyF=='all'||tyF==x.type)&&(!q||code(m,x.no).toLowerCase().includes(q)||String(x.no)==q||(o&&(o.name+' '+o.nrc+' '+o.phone+' '+o.items).toLowerCase().includes(q)))})
 .map(({x,i})=>`<button class="st ${x.occ?(x.occ.until>=T?'paid':'due'):''} ${sel==i?'sel':''}" onclick="sel=${i};xfer=false;msg=null;go()"><b>${x.no}</b><small>${x.type=='Shop'?'Shop':'Open'}</small><small>${x.occ?x.occ.name.split(' ')[0]:'Vacant'}</small></button>`).join('');
 return h||'<span class="mut">Try a different search or filter to see more stalls.</span>'}
function shopFilter(){return `<div class="f" style="margin-bottom:10px"><label>Search items, sellers or markets<input type="search" value="${q2}" placeholder="e.g. tomatoes, Mary, City Market" oninput="q2=this.value;$('sl').innerHTML=shopList()"></label>
 <label>Market<select onchange="mkF=this.value;$('sl').innerHTML=shopList()">${opt('all','All markets',mkF)}${S.markets.map((x,i)=>opt(i,x.name,mkF)).join('')}</select></label>
 <label>Maximum price (K)<input type="number" min="0" value="${pmax||''}" oninput="pmax=+this.value||0;$('sl').innerHTML=shopList()"></label>
 <label>Sort by<select onchange="srt=this.value;$('sl').innerHTML=shopList()">${opt('','Default',srt)}${opt('low','Price: low to high',srt)}${opt('high','Price: high to low',srt)}${opt('sold','Most sold',srt)}</select></label></div>`}
function shopList(){const q=q2.toLowerCase();
 let L=S.list.map((l,i)=>({l,i})).filter(({l})=>{const m=S.markets[l.mi],o=m.stalls[l.no-1].occ;return(flt=='all'||(flt=='fast'&&fast(l))||(flt=='deal'&&l.was>l.price))&&(mkF=='all'||l.mi==+mkF)&&(!q||(l.item+' '+m.name+' '+(o?o.name:'')).toLowerCase().includes(q))&&(!pmax||l.price<=pmax)});
 if(srt=='low')L.sort((a,b)=>a.l.price-b.l.price);else if(srt=='high')L.sort((a,b)=>b.l.price-a.l.price);else if(srt=='sold'||flt=='fast')L.sort((a,b)=>b.l.sold-a.l.sold);
 return L.map(({l,i})=>{const m=S.markets[l.mi],o=m.stalls[l.no-1].occ,inb=(cart.find(c=>c.i==i)||{q:0}).q;return `<div class="card" style="display:flex;gap:12px"><img class="pi" alt="${l.item}" src="${l.img||ph(l.item)}"><div style="flex:1"><b>${l.item}</b> ${fast(l)?'<span class="tag bad">Fast selling</span>':''} ${l.was>l.price?`<span class="tag ok">Bargain −${Math.round(100*(1-l.price/l.was))}%</span>`:''}<br><span class="mut">${m.name} · Stall ${l.no}${o?' · '+o.name:''}</span><br><span class="mut">${stars(S.sr[l.mi+'-'+l.no])}</span><br><b>${K(l.price)}</b> ${l.was>l.price?`<s class="mut">${K(l.was)}</s> `:''}<span class="mut">${l.unit}</span> · <span class="${l.qty<=5?'wa':'ok'}">${l.qty>0?l.qty+' available':'Sold out for today'}</span><span class="mut"> · ${l.sold} sold</span><br><button class="b" ${l.qty-inb>0?'':'disabled'} onclick="addCart(${i})">Add to basket</button></div></div>`}).join('')||'<p class="mut">Try a different search or filter to see more items.</p>'}
function logoHTML(){return `<h2>Council logo</h2><div class="card"><p class="mut">Upload the official Lusaka City Council logo (a PNG with a clear background works well). It appears in the header.</p><label>Logo file<input type="file" accept="image/*" onchange="pickImg(event,'l')"></label>${S.logo?'<p><button class="b s" onclick="delete S.logo;go()">Use the default emblem</button></p>':''}</div>`}
go();
</script></body></html>
